name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A fixed vcpkg keeps the package hashes stable, so the binary cache keeps hitting.
  VCPKG_COMMIT: 4702e381dbbd9b54d3f7e1eb565cd8981c1814cd
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

jobs:
  tidy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the tag is a semantic version
        if: github.ref_type == 'tag'
        run: echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sh .github/linux-deps.sh clang clang-tidy
      - run: python3 Tools/tidy.py

  build:
    needs: tidy
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win64, os: windows-2022, preset: win64, build: win64-release }
          - { name: linux64, os: ubuntu-22.04, preset: linux64, build: linux64-release }
          - { name: linux-arm64, os: ubuntu-22.04-arm, preset: linux64, build: linux64-release }
          - { name: web, os: ubuntu-24.04, preset: web, build: web-release }
          - { name: android, os: ubuntu-24.04, preset: android-arm64, build: android-arm64-release }
          - { name: ios, os: macos-15, preset: ios-arm64, build: ios-arm64-release }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The version strings count commits.
          fetch-depth: 0
      - name: Name the archive
        run: echo "ARCHIVE=UT2004-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Linux packages
        if: startsWith(matrix.name, 'linux')
        run: sh .github/linux-deps.sh
      - name: Ninja
        if: matrix.name == 'web' || matrix.name == 'android'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build tools
        # Some vcpkg ports build with autotools.
        if: matrix.name == 'ios'
        run: brew install ninja pkg-config autoconf automake libtool

      - name: vcpkg cache
        if: "!startsWith(matrix.name, 'linux')"
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'ports/**') }}
          restore-keys: vcpkg-${{ matrix.name }}-
      - name: vcpkg
        if: "!startsWith(matrix.name, 'linux')"
        run: |
          git clone https://github.com/microsoft/vcpkg
          git -C vcpkg checkout -q $VCPKG_COMMIT
          vcpkg/bootstrap-vcpkg.sh -disableMetrics
          mkdir -p vcpkg-cache

      - name: emsdk
        if: matrix.name == 'web'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk
          emsdk/emsdk install 7.0.0
          emsdk/emsdk activate 7.0.0
          echo "EMSDK=$PWD/emsdk" >> "$GITHUB_ENV"

      - name: JDK
        if: matrix.name == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Android SDK
        if: matrix.name == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # Pull requests from forks get no secrets and sign with the debug key.
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'ut.storeFile=%s\nut.storePassword=%s\nut.keyAlias=%s\nut.keyPassword=%s\n' \
              "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > Android/local.properties
          fi

      - name: WiX
        if: matrix.name == 'win64'
        run: |
          dotnet tool install --global wix --version 7.0.1
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" eula accept wix7
          "$USERPROFILE/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/7.0.1 WixToolset.Util.wixext/7.0.1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        # Maven Central turns runners away now and then, and a second try only repeats the step that failed.
        run: cmake --build --preset ${{ matrix.build }} || { sleep 60 && cmake --build --preset ${{ matrix.build }}; }

      - name: Test
        if: matrix.name == 'win64' || startsWith(matrix.name, 'linux')
        run: ctest --test-dir build/${{ matrix.preset }} -C Release -R content --output-on-failure

      - name: Package
        run: |
          mkdir out
          case ${{ matrix.name }} in
            win64)
              cpack --config build/win64/CPackConfig.cmake -C Release -G ZIP -B out/pack -D CPACK_PACKAGE_FILE_NAME=$ARCHIVE
              cmake --build --preset win64-release --target msi
              cp build/win64/UT2004.msi out/$ARCHIVE.msi ;;
            linux*)
              # SDL 3 is not in the distributions yet, so the one built here goes along.
              cp -L /usr/local/lib/libSDL3.so.0 build/linux64/System/
              cpack --config build/linux64/CPackConfig.cmake -C Release -G TGZ -B out/pack -D CPACK_PACKAGE_FILE_NAME=$ARCHIVE ;;
            web) (cd build/web/site && zip -r ../../../out/$ARCHIVE.zip .) ;;
            android) cp build/android-arm64/UT2004.apk out/$ARCHIVE.apk ;;
            # Unsigned, a sideloading tool signs it for the player's device.
            ios) cp build/ios-arm64/UT2004.ipa out/$ARCHIVE.ipa ;;
          esac
          if [ -d out/pack ]; then mv out/pack/$ARCHIVE.* out/ && rm -r out/pack; fi
      - name: Check the archive for build leftovers
        # An APK keeps its packed files under assets/ by design, an IPA has no build folder to leak.
        if: matrix.name != 'android' && matrix.name != 'ios'
        run: |
          # The installer packs the same folder as the zip.
          f=$(ls out/*.zip out/*.tar.gz 2>/dev/null || true)
          case $f in
            *.zip) unzip -Z1 "$f" > list.txt ;;
            *) tar -tzf "$f" > list.txt ;;
          esac
          wc -l list.txt
          ! grep -E '(^|/)(UT2004|User|Dev|DevUser|Make|Smoke|SmokeUser)\.ini$|\.(log|pdb|obj|o|ilk|exp|lib|a)$|CMakeFiles|vcpkg|(^|/)assets/' list.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
      - if: matrix.name == 'web' && github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/site

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f out/artifact.tar
          case "${GITHUB_REF_NAME%%+*}" in *-*) PRE=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --generate-notes $PRE

  pages:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
